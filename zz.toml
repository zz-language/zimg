[package]
name = "zimg"
version = "0.3.0"
authors = ["zaidejjo <zaidejjo@gmail.com>"]
description = "Pillow-style imaging for ZZ, powered by libvips"
license = "MIT"
repository = "https://github.com/zz-language/zimg"
category = "utilities"
keywords = ["zimg"]

[native]
backend = "cc"
manifest = "plugin.zzi"

[native.build-cc]
sources = ["csrc/zimg_wrapper.c"]
include_dirs = ["csrc"]
defines = ["NDEBUG"]
cflags = ["-O2", "-Wall", "-Wextra", "-fPIC"]
libs = []
pkg_config = ["vips"]
targets = ["linux-x86_64-gnu-glibc2.28", "linux-x86_64-musl", "macos-arm64-min11.0", "macos-x86_64-min12.0"]
