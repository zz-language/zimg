name: zimg CI

on:
  push:
  pull_request:

env:
  # Upstream toolchain source. Must carry the C-plugin ABI
  # (zz_runtime::c_abi + C-ABI manifest support).
  ZZ_REPO: https://github.com/zaidejjo/zz
  ZZ_REF: main

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: zimg

      - name: Install libvips
        run: sudo apt-get update && sudo apt-get install -y libvips-dev pkg-config

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build zz toolchain
        run: |
          git clone --depth 1 --branch "$ZZ_REF" "$ZZ_REPO" zz_lang || git clone --depth 1 "$ZZ_REPO" zz_lang
          cargo install --path zz_lang/crates/zz_cli --root "$HOME/.zz-bin"
          echo "$HOME/.zz-bin/bin" >> "$GITHUB_PATH"

      - name: Build native glue (declarative, no scripts)
        working-directory: zimg/tests/e2e
        run: |
          zz install
          test -f ../../build/zimg_wrapper.o
          test -f ../../build/libzimg.a
          test -f ../../build/libzimg.so
          grep -q 'backend = "cc"' ../../zz.toml

      - name: Prove glue has no Rust
        working-directory: zimg
        run: |
          grep -q "^// C-ABI: 1" plugin.zzi
          ! grep -q "^// Rustc:" plugin.zzi
          test ! -d native

      - name: Run e2e (VM + AOT)
        working-directory: zimg/tests/e2e
        run: ZZ=zz ./run_tests.sh
